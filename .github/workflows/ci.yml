name: CI

# The distribution's pipeline, in three tiers (matching the granularity of docs/10-testing-security.md):
#
#   core-test  **all internal tests** of the kernel -- the distribution ships the core dependency itself,
#              and whether it is green decides whether this product can ship. A separate job so that it has
#              **its own name** in the run list (`core-test passed`) instead of being mixed into
#              "our own tests" -- when something breaks it is obvious whether it is the kernel's problem or the distribution's.
#   dist-test  the distribution's own: formatting, vet, whether the assembly manifest is stale, module tests
#   e2e        a real binary + the kernel's fake upstream, exercising the end-to-end behavior of distribution modules
#
# Triggers match the kernel's: push to main, someone opens a PR, and manual (PR triggers were added back 2026-09-20).
#
# Adding `pull_request` answers "are other people's PRs checked" -- this repository's README now openly
# invites forks, and a PR submitted should not be met with "nobody checks it". It **does not change this repository's own flow**:
# a direct push to main still only runs the push event.
#
# It is **not a gate**: a gate means enabling branch protection on main and making these three jobs required, and that means
# no more direct pushes to main. The current trade-off is not to do that -- direct pushing is still the main path, so "run everything locally
# before pushing" remains part of the process (see the two command blocks in CLAUDE.md §4).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-test:
    name: core-test (all internal tests of the kernel)
    runs-on: ubuntu-latest
    # Same intent as the kernel CI: pin the config directory so the runner's real config does not leak in.
    env:
      NEWGATE_HOME: /tmp/nc-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          # Point at go.mod rather than go.sum: the kernel **has no third-party dependencies**, there is no go.sum in the repository,
          # and pointing at a nonexistent file makes setup-go unable to compute a cache key (see the kernel CI's comment).
          cache-dependency-path: core/go.mod

      # GOPROXY=off: the kernel's build and tests are **fully offline** (true since 2026-09-20, when the distribution
      # mechanisms moved out of the kernel). This turns "offline" into a fact CI goes red on.
      - name: Kernel unit tests (offline)
        working-directory: core
        run: GOPROXY=off go test ./...

      - name: Kernel format / manifests / vet
        working-directory: core
        run: |
          make check-fmt
          make check-generate
          go vet ./...

  dist-test:
    name: dist-test (the distribution's own modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The distribution has third-party dependencies (modules/ssh-tunnel → golang.org/x/crypto), so
          # the cache key points at go.sum. **The core-test job above is unaffected**: the kernel still has zero dependencies.
          cache-dependency-path: go.sum

      - name: Format and vet
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "Bad formatting, run gofmt -w:"; echo "$out"; exit 1; fi
          go vet ./...

      # The manifest is **generated but checked in**: it records "what this commit installs". Being stale means
      # someone changed a spec or a module directory without regenerating -- a silent mismatch between artifact and source.
      - name: Is the assembly manifest stale
        run: go run ./tools/distgen -check

      # Localization: whether the ledger is stale, whether placeholders line up between translations and source, whether there are orphan translations,
      # and the ratchet "no more Chinese literals in non-test source".
      #
      # The criterion lives in the kernel (core/tools/i18n), and the distribution uses **the same ruler** -- so the commands
      # run from that kernel package with the path arguments pointing at the distribution itself. The scanner stops at nested Go modules
      # (see core/tools/i18n/scan.SkipDir), so `core/` is not counted.
      #
      # Only the checks that cost nothing and touch no network run here. Translation (`tools/i18n sync`) calls an LLM,
      # so it only runs on a developer's machine -- **not in CI, and not in the release flow**.
      - name: Localization (ledger and catalogs)
        run: |
          go run github.com/rzbdz/newgate/tools/i18n extract -root . -catalogs modules/i18n/catalogs -check
          go run github.com/rzbdz/newgate/tools/i18n check -root . -catalogs modules/i18n/catalogs -allowlist tools/i18n-allowlist.json
          # The compile-time form of the catalog table: the runtime reads the .bin, so "edited the JSON but forgot to regenerate"
          # means a few translations silently go missing (there is another ratchet in the tests; this is the pipeline's copy).
          go run github.com/rzbdz/newgate/tools/i18n bundle -root . -catalogs modules/i18n/catalogs -check

      # -race: the distribution's own modules have concurrent paths too (porthub's table read by several UIs at once,
      # web-dashboard's BFF, arch-diagram's on-the-spot build), and their default failure mode is
      # "always fine, crashes only under load" -- the most expensive kind. Measured cost 1s → 6s; affordable.
      - name: Module tests (with race detection)
        run: go test -race ./...

  e2e:
    name: Zero-token end to end (the distribution's binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # The distribution has third-party dependencies (modules/ssh-tunnel → golang.org/x/crypto), so
          # the cache key points at go.sum. **The core-test job above is unaffected**: the kernel still has zero dependencies.
          cache-dependency-path: go.sum

      # Script dependencies: python3 (the kernel's fake upstream), curl (to hit the proxy), coreutils (md5sum).
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl coreutils

      # NEWGATE_ALL=1: CI builds **every spec in the repository**. Locally only the default one is built,
      # but "another config does not compile" is invisible locally (nobody builds the skeleton config daily),
      # so it goes on the pipeline. Release only ships the flagship one (see release.yml).
      - name: Build every spec (through build/build.sh, the same path as release)
        run: NEWGATE_ALL=1 bash build/build.sh dist

      - name: End to end for distribution modules (binary from the default config)
        run: bash mock/e2e_claude_dist.sh

      # The browser's write path: snapshot -> save -> write again with a stale baseline (must be 409, and must not overwrite the file on disk)
      # -> the two gates (Content-Type / Host). It verifies the security semantics of **the only place in this product where two writers change
      # the same file**, and that is visible only at this layer (real process + real HTTP).
      - name: End to end for the control plane (snapshot / save / conflict / two gates)
        run: bash mock/e2e_dashboard.sh

      # The model-list path (behind the web dropdown): the adapter assembling the address, parsing groups, cache/refresh,
      # and "the upstream has no such endpoint" must be 200 + supported:false rather than a failure.
      - name: End to end for the model list (fake upstream)
        run: bash mock/e2e_modellist.sh

      # Those first three minutes on a new machine: the `newgate config` wizard (pick a client ->
      # one base/key/model -> write to disk -> really install + really take over -> start the proxy). It uses a fake terminal (pty)
      # and a fake package manager, so it needs no human and installs nothing on this machine.
      - name: First-run setup wizard (newgate config, fake terminal + fake npm + fake upstream)
        run: bash mock/e2e_config.sh

      # The "this client is not installed" path: ask once, install best-effort, then start as usual; and
      # its boundary -- when the tool **is** there, not one word of its command line is touched. It uses a **fake npm**, so this
      # path neither goes online nor really installs anything on this machine (the sandbox PATH is sealed).
      - name: Install path when no client is installed (fake npm)
        run: bash mock/e2e_install.sh

      # The consumer path: `newgate ask`. It locks three things that would fail silently -- the body and the chain of thought stay separable,
      # the question actually sent is that sentence (option values are not part of it), and --profile is a single-call override.
      # The fake upstream records received requests, so the second one can be verified conclusively.
      - name: Ask a question directly (newgate ask, fake upstream)
        run: bash mock/e2e_ask.sh

      # Codex's two takeover modes: takeover writes tier names, rename writes codex's own model names,
      # and the latter relies on a dynamic role table to map them back to tiers when a request comes in. It locks four things -- the mode really changes
      # the value written into config.toml, those names really resolve (what is asserted is **the model name the upstream received**,
      # not HTTP 200), adding a row for a new model needs no restart, and after switching back to takeover those names
      # are no longer recognized as roles (people who do not take this path are unaffected).
      - name: Codex's two takeover modes (fake upstream)
        run: bash mock/e2e_codex_modes.sh

      # Hermes takeover: byte surgery on config.yaml (other people's things stay put, a scalar mixed into auxiliary
      # does not get in the way), both usages work (tier names follow newgate / `newgate-<profile>` pins a named one,
      # asserting **the model name the upstream received**), its service probe against the local base_url returning 404 does not bump the failure count,
      # a new profile while the daemon is running syncs into the list automatically without **changing back** the main model the user picked in hermes,
      # and `off` restores (things the user changed during takeover are kept).
      - name: Hermes takeover and /model list sync (fake upstream)
        run: bash mock/e2e_hermes.sh

      # Codex × DeepSeek **tool crossover**: the old version hangs tools under input[0] (DeepSeek does not read there),
      # the new one puts them at the top level but may mix in custom (the upstream only knows apply_patch), and on the response side degraded
      # calls must be turned back into custom_tool_call. It locks the class of failure that **reports no error** -- unlifted, the model cannot see
      # the tools, the request still returns 200, the body even looks plausible, and not one tool_result comes back.
      - name: Codex × DeepSeek tool crossover (fake upstream)
        run: bash mock/e2e_codex_tools.sh

      # Codex × DeepSeek reasoning tail shape: when `/responses`' input[] ends with
      # function_call_output and history holds call_ids produced by other vendors, the upstream falsely reports
      # `reasoning_text ... must be passed back` (the real 400 -> 200 measurement is in
      # docs/06-reasoning.md §1.1 / §2e). It locks three things -- when it should be added it is appended at the end of input[] with
      # the body verbatim as continue, when all ids are self-produced not one byte changes (a healthy chain is not polluted;
      # around 1/3 of requests on 2026-09-21 were pointlessly injected here), and the switch really stops it.
      - name: The provenance criterion for DeepSeek's tail shape (fake upstream)
        run: bash mock/e2e_deepseek_tail_origin.sh

      # The Responses dialect and the messages dialect get **the same** adaptation (the user's request on 2026-09-23:
      # "make sure code adaption is good as claude one"). It locks four things -- rewriting an unsupported
      # thinking effort (including the **streaming** case "HTTP 200 + a response.failed inside the event stream",
      # where a status-code-only criterion is all green), the first request after a restart being saved by the on-disk cache (streaming failures
      # never reach learnQuirks, so the cache is the only path), lossy reconstruction at the end of input[]
      # when taking over an unclosed tool loop across upstreams, and three kinds of "leave it alone when it should be left alone" (an effort the upstream accepted, a reasoning shape
      # it does not recognize, a call_id of unknown provenance).
      - name: Responses dialect adaptation (thinking effort / restart cache / cross-upstream migration)
        run: bash mock/e2e_codex_responses.sh

      # Regression guard for multiple configs and binaries: the `newgate` built from the skeleton config (framework + hello)
      # should be hello world. It is also the evidence that "the kernel's entry-declaration chain really works on the distribution side" --
      # if that chain breaks, the skeleton distribution just reports "nobody claimed it" and exits.
      - name: The skeleton config's binary is hello world too
        run: |
          export NEWGATE_HOME="$(mktemp -d)/hello"
          out="$(dist/newgate-hello-linux-amd64)"
          echo "$out"
          case "$out" in
            *"hello world"*) : ;;
            *) echo "the skeleton config's newgate did not print hello world"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: |
          for d in /tmp/newgate-dist-e2e.* /tmp/newgate-claude-e2e.* /tmp/newgate-tailorigin.* /tmp/newgate-codexresp.* /tmp/newgate-codextools.* /tmp/newgate-modellist-e2e.*; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            find "$d" -name '*.log' -exec sh -c 'echo "--- {}"; tail -80 "{}"' \;
          done
          # When the port is held by a process leaked from a previous round, the failure looks **unrelated to the port** (the new process simply cannot start,
          # and everything on screen says "not connected"). Tracking down the holder is far more useful than reading ten timeouts.
          echo "=== listeners on the e2e ports ==="
          (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E ':(1809[0-9]|1810[0-9])' || echo "(none)"
