name: CI

# 发行版的流水线，三档（对应 docs/10-testing-security.md 的粒度）：
#
#   core-test  内核的**全部内部测试** —— 发行版带的就是 core 这份依赖，
#              它绿不绿直接决定这个产品能不能发。单独一个 job 是为了让它在
#              run 列表里**有自己的名字**（`core-test passed`），而不是混在
#              「我们自己的测试」里——出错时一眼能看出是内核的事还是发行版的事。
#   dist-test  发行版自己的：格式、vet、装配清单是否过期、模块测试
#   e2e        真二进制 + 内核的假上游，跑发行版模块的端到端行为
#
# 触发条件与内核那边一致：push 到 main、有人开 PR、以及手动（2026-09-20 加回 PR）。
#
# 加 `pull_request` 解决的是「别人的 PR 有没有被检查」——本仓库的 README 现在明着
# 招人 fork，提上来的 PR 不该是一句「没人检查」。它**不改变本仓库自己的流程**：
# 直推 main 照样只跑 push 那一次。
#
# 它**不是门禁**：门禁要 main 上开分支保护、把这三个 job 设成 required，而那意味着
# 以后不能直推 main。当前取舍是不那么做——直推仍是主路径，所以「推之前先本地跑
# 一遍」依然是流程的一部分（见 CLAUDE.md §4 的两段命令）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-test:
    name: core-test（内核的全部内部测试）
    runs-on: ubuntu-latest
    # 与内核 CI 同一个意图：钉住配置目录，别让 runner 上的真实配置漏进来。
    env:
      NEWGATE_HOME: /tmp/nc-core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          # 指 go.mod 而不是 go.sum：内核**没有第三方依赖**，仓库里没有 go.sum，
          # 指着一个不存在的文件会让 setup-go 算不出缓存键（见内核 CI 的注释）。
          cache-dependency-path: core/go.mod

      # GOPROXY=off：内核的构建与测试**完全离线**（2026-09-20 起，发行版机制搬出
      # 内核之后成立）。这条把「离线」变成 CI 会红的事实。
      - name: 内核单测（离线）
        working-directory: core
        run: GOPROXY=off go test ./...

      - name: 内核格式 / 清单 / vet
        working-directory: core
        run: |
          make check-fmt
          make check-generate
          go vet ./...

  dist-test:
    name: dist-test（发行版自己的模块）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      - name: 格式与 vet
        run: |
          out=$(gofmt -l .); if [ -n "$out" ]; then echo "格式不对，跑 gofmt -w："; echo "$out"; exit 1; fi
          go vet ./...

      # 清单是**生成物但进版本控制**：它记着「这份提交装了什么」。过期了就说明
      # 有人改了规格书或模块目录却没重新生成——那是产物与源码对不上的静默故障。
      - name: 装配清单是否过期
        run: go run ./tools/distgen -check

      # 本地化：账本是否过期、译文与源文的占位符是否对得上、有没有孤儿译文、
      # 以及「非测试源码里不许再冒出中文字面量」这条棘轮。
      #
      # 判据的实现住内核（core/tools/i18n），发行版用**同一把尺子**——所以命令
      # 从内核那个包跑，路径参数指发行版自己。扫描器遇到嵌套的 Go module 会停下
      # （见 core/tools/i18n/scan.SkipDir），所以 `core/` 不会被算进来。
      #
      # 这里只跑不花钱、不出网的那几条。翻译（`tools/i18n sync`）要调 LLM，
      # 只能在开发者本地跑——**不进 CI，也不进发版流程**。
      - name: 本地化（账本与目录）
        run: |
          go run github.com/rzbdz/newgate/tools/i18n extract -root . -catalogs modules/i18n/catalogs -check
          go run github.com/rzbdz/newgate/tools/i18n check -root . -catalogs modules/i18n/catalogs -allowlist tools/i18n-allowlist.json

      - name: 模块测试
        run: go test ./...

  e2e:
    name: 零 token 端到端（发行版的二进制）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod

      # 脚本的依赖：python3（内核的假上游）、curl（打代理）、coreutils（md5sum）。
      - name: 装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 curl coreutils

      # NEWGATE_ALL=1：CI 把**仓库里每一份规格书**都编一遍。本地只编默认那份，
      # 但「另一份配置编不过」这种故障在本地看不见（谁也不天天编骨架配置），
      # 所以放到流水线上。Release 只发重点那份（见 release.yml）。
      - name: 构建全部规格书（走 build/build.sh，与发布同一条路）
        run: NEWGATE_ALL=1 bash build/build.sh dist

      - name: 发行版模块的端到端（默认配置的二进制）
        run: bash mock/e2e_claude_dist.sh

      # 多配置多 bin 的回归守卫：骨架配置（框架 + hello）装出来的 `newgate`
      # 就该是 hello world。它同时是「内核那条入口申报链在发行版这一侧真的通」
      # 的证据——这条链断了的话，骨架发行版跑起来只会报一句「没人认领」并退出。
      - name: 骨架配置的二进制也是 hello world
        run: |
          export NEWGATE_HOME="$(mktemp -d)/hello"
          out="$(dist/newgate-hello-linux-amd64)"
          echo "$out"
          case "$out" in
            *"hello world"*) : ;;
            *) echo "骨架配置的 newgate 没跑出 hello world"; exit 1 ;;
          esac

      - name: 失败时导出日志
        if: failure()
        run: |
          for d in /tmp/newgate-dist-e2e.* /tmp/newgate-claude-e2e.*; do
            [ -d "$d" ] || continue
            echo "=== $d ==="
            find "$d" -name '*.log' -exec sh -c 'echo "--- {}"; tail -80 "{}"' \;
          done
