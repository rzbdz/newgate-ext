name: release

# 发行版自己的发布流水线。它在**这个仓库**里，不在内核仓库里——发行节奏是发行版
# 作者的事：内核今天合了什么，不该决定你的产品什么时候发新版。
#
# 它做的就是把 build/build.sh 跑一遍（一个平台矩阵），然后把产物**发布成 GitHub
# Release**——这样产物是「可下载的」而不只是躺在 Actions 的 artifact 里（artifact
# 有保留期、还要登录才能下）。本地与 CI 走的是同一条构建路径，区别只有
# NEWGATE_PLATFORMS 这一项。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 要写权限（原来只读，那时只上传 artifact）。
permissions:
  contents: write

jobs:
  build:
    name: 编译并发布静态二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # core/ 是 submodule（内核源码钉在那一发上），构建要用它——go.mod 里
          # 那条 replace 指的就是 ./core。
          submodules: recursive
          # fetch-depth 0：版本号来自 `git describe --tags`，浅克隆上它退化成一串
          # 提交号（发出来的二进制会报不出 tag）。这个仓库不大，全量取值得。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # 跟 go.mod 走，不写死版本——否则升级 toolchain 时这里会静默落后。
          go-version-file: go.mod
          # 指 go.mod 而不是 go.sum：这个 module **没有第三方依赖**（内核也没有），
          # 仓库里没有 go.sum，指着一个不存在的文件算不出缓存键。
          cache-dependency-path: go.mod

      # 发版前把 i18n 那道门关上（`-strict`：覆盖率不足与机翻未复核都算失败）。
      #
      # 这条**在这里才第一次被调用**。在那之前 `-strict` 是个死口子：它的帮助写着
      # 「发版前用」，而 CI / release.yml / Makefile 一个调用者都没有——也就是说
      # 「发版前拦住没复核的机翻」这件事没有任何一道门在看（2026-09-21 查出来）。
      #
      # 接在这里而不是 CI：CI 每一次推送都跑，而译文复核是一个**发布节点**上的
      # 状态（机翻填进来之后要人过一遍），放进 CI 只会让人天天看一条与本次改动
      # 无关的红。放发版这一步，红了就是「这次要发的版本里有没复核的文案」，
      # 而那正是该有人看一眼的时候。
      #
      # 为什么不起单独一步做内核那份：内核的目录表已经随 build/build.sh 编进产物，
      # 而这一步查的是**这个发行版要发出去的那份文案**（发行版自己的 300 条）。
      # 内核那份由 core 自己的 make check 看着。
      - name: 发版前的文案检查（未复核的机翻不许发出去）
        run: |
          go run github.com/rzbdz/newgate/tools/i18n check \
            -root . -catalogs modules/i18n/catalogs \
            -allowlist tools/i18n-allowlist.json -strict

      # 只发**重点那份**（发行版的主配置）：骨架配置（dist-hello.json）是给人 fork
      # 的样板，不是产品，不需要挂在 Release 上。要发哪几份由这里的 NEWGATE_DISTS
      # 决定——build/build.sh 的能力是「一次编多份」，发什么是流水线的事。
      - name: 构建（平台矩阵）
        env:
          NEWGATE_DISTS: dist.json
          NEWGATE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: bash build/build.sh dist

      # 产物必须能跑、版本必须对得上。多调用型二进制（argv0 决定入口）——所以
      # 先按正确的名字落一份再跑，否则 `newgate version` 会被当成 profile 名。
      - name: 自检：产物能跑
        run: |
          mkdir -p /tmp/bin
          cp dist/newgate-*-linux-amd64 /tmp/bin/newgate
          export NEWGATE_HOME="$(mktemp -d)/ng"
          /tmp/bin/newgate version
          /tmp/bin/newgate plugin | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: newgate-static
          path: |
            dist/newgate-*
            dist/SHA256SUMS
          if-no-files-found: error

      # 打 tag 推上来 = 发一版：产物挂到 Release 上，谁都能直接下。
      # 手动触发（workflow_dispatch）只上传 artifact，不发 Release。
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/newgate-* dist/SHA256SUMS
