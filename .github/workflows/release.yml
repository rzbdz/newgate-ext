name: release

# 发行版自己的发布流水线。它在**这个仓库**里，不在内核仓库里——发行节奏是发行版
# 作者的事：内核今天合了什么，不该决定你的产品什么时候发新版。
#
# 它做的就是把 build/build.sh 跑一遍（一个平台矩阵），然后把产物**发布成 GitHub
# Release**——这样产物是「可下载的」而不只是躺在 Actions 的 artifact 里（artifact
# 有保留期、还要登录才能下）。本地与 CI 走的是同一条构建路径，区别只有
# NEWGATE_PLATFORMS 这一项。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 发布 Release 要写权限（原来只读，那时只上传 artifact）。
permissions:
  contents: write

jobs:
  build:
    name: 编译并发布静态二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # core/ 是 submodule（内核源码钉在那一发上），构建要用它——go.mod 里
          # 那条 replace 指的就是 ./core。
          submodules: recursive
          # fetch-depth 0：版本号来自 `git describe --tags`，浅克隆上它退化成一串
          # 提交号（发出来的二进制会报不出 tag）。这个仓库不大，全量取值得。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # 跟 go.mod 走，不写死版本——否则升级 toolchain 时这里会静默落后。
          go-version-file: go.mod
          # 指 go.sum：发行版**有**第三方依赖（modules/ssh-tunnel 用 golang.org/x/crypto），
          # 而 go.sum 才是那份依赖集合的指纹。内核仍然零依赖（它的 go.mod 只有三行），
          # 但那与这个 job 无关——这里编的是发行版。
          cache-dependency-path: go.sum

      # 只发**重点那份**（发行版的主配置）：骨架配置（dist-hello.json）是给人 fork
      # 的样板，不是产品，不需要挂在 Release 上。要发哪几份由这里的 NEWGATE_DISTS
      # 决定——build/build.sh 的能力是「一次编多份」，发什么是流水线的事。
      - name: 构建（平台矩阵）
        env:
          NEWGATE_DISTS: dist.json
          NEWGATE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: bash build/build.sh dist

      # 产物必须能跑、版本必须对得上。多调用型二进制（argv0 决定入口）——所以
      # 先按正确的名字落一份再跑，否则 `newgate version` 会被当成 profile 名。
      - name: 自检：产物能跑
        run: |
          mkdir -p /tmp/bin
          cp dist/newgate-*-linux-amd64 /tmp/bin/newgate
          export NEWGATE_HOME="$(mktemp -d)/ng"
          /tmp/bin/newgate version
          /tmp/bin/newgate plugin | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: newgate-static
          path: |
            dist/newgate-*
            dist/SHA256SUMS
          if-no-files-found: error

      # 打 tag 推上来 = 发一版：产物挂到 Release 上，谁都能直接下。
      # 手动触发（workflow_dispatch）只上传 artifact，不发 Release。
      #
      # Release notes 来自 CHANGELOG.md 里与 tag 对应的那一节（`v0.8.1` →
      # `## [0.8.1]`）。**没有那一节就红**，不退回自动生成的提交列表：
      # 自动 notes 只会把「改了什么」摊成一串 commit subject，而发版说明是给人
      # 读的。2026-11-04 的 v0.8.1 就是这个形状的反面教材（Release 上只有一条
      # compare 链接）。补 changelog 是发版的一部分，不是发版之后的文档工作。
      - name: 从 CHANGELOG.md 取这一版的说明
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md 里没有 [${ver}] 这一节——发版前先补上（Release notes 就是它）" >&2
            exit 1
          fi

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/newgate-* dist/SHA256SUMS
