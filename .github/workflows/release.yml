name: release

# The distribution's own release pipeline. It lives in **this repository**, not the kernel repository -- the release cadence
# is the distribution author's business: what the kernel merged today should not decide when your product ships a new version.
#
# All it does is run build/build.sh once (a platform matrix), then **publish the artifacts as a GitHub
# Release** -- so they are downloadable instead of just sitting in Actions artifacts (artifacts
# have a retention period and require a login to download). Local and CI take the same build path; the only difference
# is NEWGATE_PLATFORMS.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Publishing a Release needs write permission (it used to be read-only, back when it only uploaded artifacts).
permissions:
  contents: write

jobs:
  build:
    name: Build and publish the static binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # core/ is a submodule (the kernel source is pinned to that release), and the build needs it -- that
          # replace line in go.mod points at ./core.
          submodules: recursive
          # fetch-depth 0: the version comes from `git describe --tags`; on a shallow clone it degrades to a bare
          # commit id (the binary shipped would not be able to report a tag). This repository is small, a full fetch is worth it.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # Follow go.mod, do not hardcode a version -- otherwise this silently falls behind when the toolchain is upgraded.
          go-version-file: go.mod
          # Point at go.sum: the distribution **has** third-party dependencies (modules/ssh-tunnel uses golang.org/x/crypto),
          # and go.sum is the fingerprint of that dependency set. The kernel is still dependency-free (its go.mod is three lines),
          # but that is irrelevant to this job -- what is built here is the distribution.
          cache-dependency-path: go.sum

      # Publish only **the flagship one** (the distribution's main config): the skeleton config (dist-hello.json) is a template
      # for people to fork, not a product, and has no reason to hang off the Release. Which ones to ship is decided by
      # NEWGATE_DISTS here -- build/build.sh can build several at once; what to ship is the pipeline's business.
      - name: Build (platform matrix)
        env:
          NEWGATE_DISTS: dist.json
          NEWGATE_PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64
        run: bash build/build.sh dist

      # The artifact must run, and the version must match. A multi-invocation binary (argv0 decides the entry point) -- so
      # drop a copy under the correct name before running it, or `newgate version` gets treated as a profile name.
      - name: Self-check: the artifact runs
        run: |
          mkdir -p /tmp/bin
          cp dist/newgate-*-linux-amd64 /tmp/bin/newgate
          export NEWGATE_HOME="$(mktemp -d)/ng"
          /tmp/bin/newgate version
          /tmp/bin/newgate plugin | head -4

      - uses: actions/upload-artifact@v4
        with:
          name: newgate-static
          path: |
            dist/newgate-*
            dist/SHA256SUMS
          if-no-files-found: error

      # Pushing a tag = shipping a version: the artifacts go onto the Release, and anyone can download them directly.
      # A manual trigger (workflow_dispatch) only uploads artifacts, it does not publish a Release.
      #
      # The release notes come from the CHANGELOG.md section matching the tag (`v0.8.1` ->
      # `## [0.8.1]`). **No such section means red**, with no fallback to the auto-generated commit list:
      # auto notes only lay out "what changed" as a list of commit subjects, and release notes are meant to be
      # read. v0.8.1 on 2026-11-04 was the counterexample (its Release had only one
      # compare link). Filling in the changelog is part of shipping, not documentation work after it.
      - name: Take this version's notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no [${ver}] section -- add it before releasing (it is the release notes)" >&2
            exit 1
          fi

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/newgate-* dist/SHA256SUMS
