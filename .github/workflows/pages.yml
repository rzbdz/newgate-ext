name: pages

# Publishing the public site: source -> site/dist -> the `gh-pages` branch -> GitHub Pages.
#
# # Why "push a branch" instead of actions/deploy-pages
#
# The official path (upload-pages-artifact + deploy-pages) requires changing Pages' source to "GitHub Actions"
# **in the repository settings** -- a step someone can only click once by hand, and once anyone flips it back,
# the symptom is "the pipeline stays green and the site does not move". The `gh-pages` branch path has no implicit state beyond the API:
# build the site -> push -> Pages goes and reads it. Same trade-off as release.yml (gh CLI + branch,
# not depending on where some toggle on the platform sits).
#
# # Why paths is in the trigger
#
# The site is **rebuilt from source**, so anything that can change the site is a trigger: the docs and styles
# (site/**), the renderer (tools/sitegen/**), the demo page and the components it imports
# (modules/web-dashboard/web/** -- the demo imports `../src/...`, so changing one kind's
# styles changes it too), and this file itself.
#
# The cost of not adding paths is rebuilding and pushing gh-pages on every code push; the cost of adding paths
# is "I changed X and it did not trigger" -- so the list above errs on the wide side (all of web/ counts),
# and at worst it just runs one extra time.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/sitegen/**"
      - "modules/web-dashboard/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Pushing gh-pages needs write permission. (The default token is read-only; that path does not work.)
permissions:
  contents: write

# Two simultaneous pushes to gh-pages produce one non-fast-forward failure, and that failure **does not mean the site is broken** --
# it just means two builds collided. Serializing is cheaper than making people tell that kind of red apart.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Build the site and publish to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # sitegen itself does not import the kernel, but it is **a package in this module**: `go run`
          # has to compute the build list first, and that replace in go.mod points at ./core -- with the directory missing,
          # Go cannot even load. So the submodule is required, not something picked up by the way.
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Point at go.sum: the distribution **has** third-party dependencies now (modules/ssh-tunnel needs x/crypto),
          # and go.sum is the fingerprint of that dependency set -- go.mod does not change when only versions move.
          # The kernel side still points at core/go.mod (it is dependency-free, there is no go.sum).
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm is what the demo-page half needs (vite + svelte + codemirror). **Pin a version**,
      # do not follow latest: `pnpm-lock.yaml` was written by a particular pnpm, and reading it with
      # another major version may make pnpm rewrite the lockfile while installing a different tree -- and that is invisible
      # in local artifacts (locally you run the local pnpm).
      #
      # Once installed, hand over to site/build.sh: it runs pnpm install itself when node_modules is missing,
      # so **local and CI take the same path** (that path is this repository's only build entry point).
      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Build the site (docs + demo page)
        run: bash site/build.sh

      # `git init` in an empty directory + one commit: gh-pages is an **artifact branch** with no history worth having
      # (the site is determined by the source; the only value of the previous gh-pages was "Pages reading the old version").
      # So force push a full copy every time instead of stacking commits -- stacked, the day you need to clean the
      # history you would have to find another way.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd site/dist
          # Jekyll eats files and directories starting with an underscore. sitegen already writes a .nojekyll;
          # this step just makes "that file must exist" a visible step in the pipeline.
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -q -m "site: rebuild from ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Pushed to gh-pages (${GITHUB_SHA:0:7})"
