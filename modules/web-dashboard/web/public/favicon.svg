<!-- newgate 的图标：一座**鸟居**——日语里「gateway」就是它。选它而不是别的
     gateway 意象（桥、闸门、箭头），是因为它在 16px 上还认得出：两道横梁 + 两根
     立柱，四个形状，没有细节要靠尺寸才看得见。浏览器标签页正是 16px。

     手画而不是引一个图标库：这一份是**静态二进制里的一份 embed**，加一个前端依赖
     就为了四个矩形不划算；而字体里的 emoji（⛩️）画成什么样由各人机器上的字体决定，
     同一个产品在两台机器上长得不一样。

     底色是 app.css 的 --bg（深色），前景是 --accent。自带底色是因为浏览器标签栏
     的底色不可知：透明背景的深色图形会在深色标签栏上消失。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="newgate">
  <rect width="32" height="32" rx="7" fill="#12151b"/>
  <g fill="#5b8def">
    <!-- 笠木（顶上那道梁，两端微微上翘） -->
    <path d="M3.4 7.2c4.6-2.1 20.6-2.1 25.2 0 .5.2.7.8.5 1.3l-.6 1.6c-.2.4-.6.6-1 .5-4.3-1.4-18.7-1.4-23 0-.4.1-.9-.1-1-.5L2.9 8.5c-.2-.5 0-1.1.5-1.3z"/>
    <!-- 额束（两根梁中间那根短柱） -->
    <rect x="14.4" y="10.2" width="3.2" height="2.6" rx="0.6"/>
    <!-- 岛木（第二道梁） -->
    <rect x="5.6" y="12.6" width="20.8" height="2.8" rx="1.2"/>
    <!-- 两根立柱 -->
    <rect x="9.4" y="15.6" width="3" height="12.6" rx="1.2"/>
    <rect x="19.6" y="15.6" width="3" height="12.6" rx="1.2"/>
  </g>
</svg>
