<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>newgate</title>
    <!-- The demo page's favicon is shared with the product (public/ is vite's root-relative directory, and both entries read it). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#12151b" />
  </head>
  <body>
    <div id="app"></div>
    <!-- Same as index.html: the address is written root-relative, and vite rewrites it into an absolute one per `base`. -->
    <script type="module" src="/main.ts"></script>
  </body>
</html>
